<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration From</title>
</head>
<body>
    <h1>New Account create</h1>
    <form action="/register" method="POST" enctype="multipart/form-data">
    <fieldset>
        <legend>personal Info</legend>
        <p>
            <label for="name">Full name *</label> <br />
            <input type="text" id="name" name="name" required minlength="3" />
        </p>
           <p>
            <label for="email">Email *</label> <br />
            <input type="email" id="email" name="email" required />
        </p>
        <p>
            <label for="phone">Phone number *</label> <br />
            <input type="tel" id="phone" name="phone" required pattern="[0-9]{11}" />
        </p>
        <p>
            <label for="password">Password *</label> <br />
            <input type="password" id="password" name="password" required minlength="6" />
        </p>
        <p>
            <label for="dob">Birthday: </label> <br />
            <input type="date" id="dob" name="dob"   />
        </p>
    </fieldset>
    
    <fieldset>
        <legend>Others</legend>
        <p>
            Gender:<br />
            <input type="radio" id="m" name="gender" value="male" />
            <label for="m">purus</label>
            <input type="radio" id="f" name="gender" value="female" />
            <label for="f">Mohila</label>
        </p>
        <p>
            <label for="city">shohor:</label><br />
            <select id="city" name="city">
                <option id="">--select korun--</option>
                <option value="dhaka">Dhaka</option>
                <option value="gaibandha">Gaibandha</option>
                <option value="bandorban">Bandorban</option>
            </select>
        </p>
        <p>
            Hobby: <br/>
            <input type="checbox" id="h1" name="hobby" value="reading"/>
            <label for="h1">reading book</label>
            <input type="checbox" id="h2" name="hobby" value="coding"/>
            <label for="h2">coding</label>
            <input type="checbox" id="h3" name="hobby" value="travel"/>
            <label for="h3">traveling</label>
        </p>
        <P>
            <label for="pic">Profile photo:</label><br/>
            <input type="file" id="pic" name="pic" accept="image/*"/>
        

        </P>
        <p>
            <label for="exp">Experience (years):</label><br/>
            <input type="range" id="exp" name="exp" min="0" max="20" value="1"/>
        </p>
        <p>
            <label for="color">Favorite color:</label><br/>
            <input type="color" id="color" name="color" />
        </p>
        <p>
            <label for="about">myself</label><br/>
            <textarea id="about" name="about" rows="4" cols="40"></textarea>
        </p>
        <p>
            <input type="checbox" id="tos" required />
            <label for="tos">ami niom mani</label>
        </p>
    </fieldset>
    <button type="submit">Register</button>
    <button type="reset">clear</button>
    </form>
</body>
</html>
